name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read repository contents.
permissions:
  contents: read

jobs:
  node:
    name: Node apps (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @nexora/shared-types run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

      - name: Test
        run: pnpm -r run test

      - name: Build
        run: |
          pnpm --filter @nexora/api run build
          pnpm --filter @nexora/worker run build
          pnpm --filter @nexora/web run build

  api-integration:
    name: API integration (migrations · e2e · isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Compose DATABASE_URL
        run: |
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @nexora/shared-types run build

      - name: Run migrations
        run: pnpm --filter @nexora/api run migration:run

      - name: API e2e tests
        run: pnpm --filter @nexora/api run test:e2e

  python:
    name: AI service (lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: pytest -q

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false

      - name: Build AI service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/ai-service.Dockerfile
          push: false

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/worker.Dockerfile
          push: false

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: false
