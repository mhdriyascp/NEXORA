apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: nexora
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: nexora
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ai-service
          image: ghcr.io/mhdriyascp/nexora-ai-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexora-secrets
                  key: AI_SERVICE_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexora-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexora-secrets
                  key: OPENAI_API_KEY
          envFrom:
            - configMapRef:
                name: nexora-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: nexora
spec:
  selector:
    app.kubernetes.io/name: ai-service
  ports:
    - port: 8000
      targetPort: 8000
