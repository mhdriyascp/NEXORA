# Template ONLY — apply via a real secrets manager, do not commit real values.
# Example provisioning (from a secure shell, not from git):
#   kubectl -n nexora create secret generic nexora-secrets \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=REDIS_URL=... \
#     --from-literal=JWT_ACCESS_SECRET=... \
#     --from-literal=JWT_REFRESH_SECRET=... \
#     --from-literal=AI_SERVICE_TOKEN=... \
#     --from-literal=OPENAI_API_KEY=...
#
# In production prefer the External Secrets Operator so values are pulled from
# AWS Secrets Manager and rotated automatically.
apiVersion: v1
kind: Secret
metadata:
  name: nexora-secrets
  namespace: nexora
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  JWT_ACCESS_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  AI_SERVICE_TOKEN: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
