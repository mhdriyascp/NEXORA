# Routes external traffic to the web UI and the API. Assumes an ingress
# controller (e.g. AWS Load Balancer Controller / nginx) and cert-manager for
# TLS are installed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora
  namespace: nexora
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.nexora.example
        - api.nexora.example
      secretName: nexora-tls
  rules:
    - host: app.nexora.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: api.nexora.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
